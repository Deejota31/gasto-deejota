# Netlify lee este archivo al conectar el repo: no hace falta escribir nada en la configuración.
[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Una sola página (las pestañas usan #hash): cualquier ruta sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad (S-01). La CSP viaja en modo "solo informe" hasta comprobarla en un deploy de rama:
# para hacerla efectiva basta cambiar el nombre de la cabecera a Content-Security-Policy (ver docs/SEGURIDAD.md).
# Una prueba e2e (web/e2e/csp.spec.ts) sirve la compilación con ESTA misma política como obligatoria y exige cero violaciones.
#  - connect-src: Apps Script responde en script.google.com y redirige a script.googleusercontent.com.
#  - style-src 'unsafe-inline': Recharts y React escriben atributos style; no hay <style> ni scripts en línea.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
